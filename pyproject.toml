[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mastering-rag"
version = "1.0.0"
description = "Local RAG examples with Ollama, PostgreSQL, and pgvector"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["mastering_rag*"]
